name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/test-client.js
      - run: node tests/test-ai.js
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Prepare fixed signing key
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/routermate.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/routermate.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 secret missing: building with a temporary debug key (updates will not install over older builds)"
          fi
      - run: gradle --no-daemon assembleDebug
        env: { KEYSTORE_PASSWORD: '${{ secrets.KEYSTORE_PASSWORD }}', KEY_ALIAS: '${{ secrets.KEY_ALIAS }}' }
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-admin-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk WiFi-Admin.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest WiFi-Admin.apk --title "WiFi Admin (latest)" --notes "Download WiFi-Admin.apk on your Android phone and install it."
